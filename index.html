<script>

/* 弹窗 */
function openVersion(){
document.getElementById("versionModal").style.display="block";
}

function closeVersion(){
document.getElementById("versionModal").style.display="none";
}

/* 1.5秒自动弹 */

openVersion();
},1500);

/* ===== 渠道统计 ===== */

function getChannel(){
const url=new URL(window.location.href);
return url.searchParams.get("channel")||"direct";
}

(function(){
let channel=getChannel();
let data=JSON.parse(localStorage.getItem("stats")||"{}");

if(!data[channel]) data[channel]={visit:0,click:0};

data[channel].visit++;

localStorage.setItem("stats",JSON.stringify(data));

console.log("渠道统计:",data);
})();

function trackDownload(){
let channel=getChannel();
let data=JSON.parse(localStorage.getItem("stats")||"{}");

if(!data[channel]) data[channel]={visit:0,click:0};

data[channel].click++;

localStorage.setItem("stats",JSON.stringify(data));

console.log("点击统计:",data);
}
