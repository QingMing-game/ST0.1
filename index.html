<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>率土国际服·热血福利服</title>

<style>

/* ===== 🎬 视频背景 ===== */
video.bg-video{
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* 暗层 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  z-index:-1;
}

body{
  margin:0;
  font-family:Arial;
}

/* ===== 🔘 中心按钮 ===== */
.center-btn{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:80px;
  height:80px;
  border-radius:50%;
  background:#c03a2b;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  cursor:pointer;
  transition:0.3s;
  z-index:10;
}

.center-btn.active{
  transform:translate(-50%,-50%) rotate(45deg);
}

/* ===== 📦 展开内容 ===== */
.panel{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  max-width:500px;
  margin:auto;
  right:0;

  background:rgba(255,246,228,0.9);
  backdrop-filter:blur(10px);

  border-radius:20px 20px 0 0;
  padding:20px;

  transform:translateY(100%);
  transition:0.4s;
}

.panel.show{
  transform:translateY(0);
}

.btn{
  display:block;
  margin:10px 0;
  padding:14px;
  border-radius:12px;
  background:#c03a2b;
  color:#fff;
  text-align:center;
  text-decoration:none;
}

/* ===== 📱 自适应 ===== */
@media (min-width:768px){
  .center-btn{
    width:100px;
    height:100px;
    font-size:16px;
  }

  .panel{
    max-width:420px;
    left:auto;
    right:40px;
    bottom:40px;
    border-radius:20px;
  }
}

/* ===== 弹窗（带GIF背景） ===== */
#versionModal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
}

/* GIF背景 */
.modal-bg{
  position:absolute;
  inset:0;
  background:url("https://raw.githubusercontent.com/QingMing-game/ST0.1/main/BKG.gif") center/cover no-repeat;
  filter:brightness(0.4);
}

.modal-content{
  position:relative;
  width:95%;
  max-width:500px;
  margin:50px auto;
}

.modal-text{
  background:#fff6e4;
  padding:15px;
  border-radius:10px;
  white-space:pre-line;
}

.close-btn{
  position:fixed;
  right:20px;
  top:20px;
  width:40px;
  height:40px;
  background:red;
  color:#fff;
  border-radius:50%;
  text-align:center;
  line-height:40px;
}

</style>
</head>

<body>

<!-- 🎬 视频 -->
<video class="bg-video" autoplay muted loop playsinline>
  <source src="https://raw.githubusercontent.com/QingMing-game/ST0.1/main/VD1.mp4" type="video/mp4">

<!-- 🔘 中心按钮 -->
<div class="center-btn" onclick="togglePanel()">点击</div>

<!-- 📦 内容面板 -->
<div class="panel" id="panel">

<!-- 弹窗 -->

<script>

function togglePanel(){
  let panel=document.getElementById("panel");
  let btn=document.querySelector(".center-btn");

  panel.classList.toggle("show");
  btn.classList.toggle("active");
}

/* 弹窗 */
function openVersion(){
document.getElementById("versionModal").style.display="block";
}
function closeVersion(){
document.getElementById("versionModal").style.display="none";
}

/* 自动弹 */
setTimeout(openVersion,1500);

</script>

</body>
