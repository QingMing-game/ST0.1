<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>情谊率土 · 热血福利服 - 震撼开启</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════
   变量与基础
════════════════════════════════ */
:root{
  --red:#b8311f; --red2:#d94030; --red3:#e05a4a;
  --gold:#b8862a; --gold2:#e8bb5c; --gold3:#f8d888; --gold4:#fff0b8;
  --cream:#fff8e8;
  --panel:#0e0400f5; --modal:#090200f8;
  --bd:rgba(184,134,42,0.32);
  --bd2:rgba(184,134,42,0.18);
  --ff-d:'Ma Shan Zheng',serif;
  --ff-t:'ZCOOL XiaoWei','Noto Serif SC',serif;
  --ff-b:'Noto Serif SC',serif;
  --ff-n:'Bebas Neue',monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ════════════════════════════════
   背景与高级质感
════════════════════════════════ */
body{
  margin:0; font-family:var(--ff-b); background:#000;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}

/* 视频背景优化：增加 poster 封面 */
video.bg{
  position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 30%;z-index:-2;
}

/* 蒙层与噪点：消除渐变断层，增加电影质感 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(6,0,0,.65) 0%,rgba(6,0,0,.25) 45%,rgba(6,0,0,.9) 100%);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; opacity: 0.04; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ════════════════════════════════
   顶部标题
════════════════════════════════ */
.top{
  position:fixed;top:max(20px,env(safe-area-inset-top));
  left:50%;transform:translateX(-50%);
  z-index:20;text-align:center;pointer-events:none;width:max-content;
}
.top-title{
  font-family:var(--ff-d);font-size:clamp(22px,5.5vw,36px);
  color:var(--gold2);letter-spacing:6px;white-space:nowrap;
  text-shadow:0 0 20px rgba(232,187,92,.6),1px 2px 0 #000;
}
.top-sub{
  font-size:clamp(9px,2vw,11px);color:rgba(255,248,232,.45);
  letter-spacing:5px;margin-top:6px;text-transform:uppercase;
}

/* ════════════════════════════════
   核心交互按钮 (中心)
════════════════════════════════ */
.enter-btn{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:clamp(90px,16vw,130px);height:clamp(90px,16vw,130px);
  border-radius:50%; background:radial-gradient(circle at 36% 30%,var(--red3),#8a1808);
  border:2px solid var(--gold2); outline:1px solid rgba(184,134,42,.2);outline-offset:8px;
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;z-index:10; transition:all .4s cubic-bezier(.34,1.56,.64,1);
  animation:breathe 3.2s ease-in-out infinite;
}
.enter-btn .ec{font-family:var(--ff-d);font-size:clamp(26px,5.5vw,34px);letter-spacing:4px;}
.enter-btn .es{font-family:var(--ff-b);font-size:10px;opacity:.5;letter-spacing:2px}

@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 20px rgba(184,50,30,0.4)}50%{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 40px rgba(184,50,30,0.7)}}
.enter-btn.hide{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(0.8)}

/* ════════════════════════════════
   底部抽屉面板
════════════════════════════════ */
.panel{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
  width:100%;max-width:500px;z-index:30;
  background:var(--panel);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
  border:1px solid var(--bd);border-bottom:none;border-radius:24px 24px 0 0;
  transition:transform .5s cubic-bezier(.22,1,.36,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.panel.show{transform:translateX(-50%) translateY(0)}

.p-handle{height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.p-handle::after{content:"";width:45px;height:4px;border-radius:2px;background:var(--gold);opacity:.3}

.p-head{padding:0 24px 16px;text-align:center;border-bottom:1px solid var(--bd2)}
.p-title{font-family:var(--ff-d);font-size:22px;color:var(--gold2);letter-spacing:2px}

/* 倒计时样式 */
.cd-row{display:flex;justify-content:center;gap:8px;margin:15px 0}
.cd-box{
  width:58px;height:70px;background:linear-gradient(160deg,#280700,#160300);
  border:1px solid rgba(184,134,42,0.4);border-radius:10px;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.cd-n{font-family:var(--ff-n);font-size:38px;color:#fff;text-shadow:0 0 15px var(--red)}
.cd-lbl{font-size:11px;color:rgba(255,248,232,0.4);margin-top:4px}
.cd-unit{display:flex;flex-direction:column;align-items:center}
.cd-sep{font-size:24px;color:var(--gold);opacity:.5;padding-top:15px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.1}}

/* ════════════════════════════════
   通用按钮 (扫光动效)
════════════════════════════════ */
.btn{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:15px;border-radius:12px;
  font-family:var(--ff-t);font-size:16px;letter-spacing:2px;
  cursor:pointer;text-decoration:none;border:none;transition:all .2s;
}
.btn:active{transform:scale(.97)}

.btn-red{
  background:linear-gradient(135deg,#c93520 0%,#8c1808 100%);
  color:var(--gold3);border:1px solid rgba(184,134,42,.4);
  box-shadow:0 4px 20px rgba(184,50,30,.4);
}
/* 扫光伪元素 */
.btn-red::after {
  content: ""; position: absolute; top: -50%; left: -100%;
  width: 50%; height: 200%;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
  transform: rotate(35deg); animation: shine 4s infinite;
}
@keyframes shine { 0% { left: -100%; } 20% { left: 120%; } 100% { left: 120%; } }

.btn-blue{
  background:linear-gradient(135deg,#1860b0,#0b4280);
  color:#cce0ff;border:1px solid rgba(70,130,240,.3);
}

.p-btns{padding:20px;display:flex;flex-direction:column;gap:12px}

/* ════════════════════════════════
   弹窗与内容
════════════════════════════════ */
#modal{
  display:none;position:fixed;inset:0;z-index:9999;
}
.m-bg{position:absolute;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px)}
.m-wrap{
  position:absolute;inset:0;overflow-y:auto;padding:20px 15px 100px;
  display:flex;justify-content:center;
}
.m-card{
  position:relative;width:100%;max-width:600px;
  background:var(--modal);border:1px solid var(--bd);
  border-radius:20px; height:max-content;
}

.m-body{padding:20px}
.sec{margin-bottom:25px}
.sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--bd2);padding-bottom:8px}
.sec-name{font-family:var(--ff-t);font-size:17px;color:var(--gold2)}

/* 数据卡片样式 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat-cell{background:rgba(184,134,42,.08);border:1px solid var(--bd2);padding:12px;border-radius:10px;text-align:center}
.stat-v{font-family:var(--ff-n);font-size:24px;color:var(--gold2)}
.stat-k{font-size:11px;color:rgba(255,248,232,0.4);margin-top:4px}

/* 悬浮关闭条 */
.m-close-bar{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  width:90%;max-width:400px;z-index:10001;display:none;
}
.m-close-bar.visible{display:block;animation:slideUp .4s forwards}
@keyframes slideUp{from{transform:translateX(-50%) translateY(40px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

.close-btn-main{
  width:100%;padding:15px;border-radius:30px;background:rgba(184,50,30,.95);
  border:1px solid var(--gold2);color:#fff;font-family:var(--ff-t);
  font-size:16px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5);
}

/* 提示文字 */
.note{background:rgba(184,134,42,0.05);border-left:3px solid var(--gold);padding:10px 15px;font-size:12px;color:rgba(255,248,232,0.6);line-height:1.6;margin-top:10px}

/* 数字翻转微动效 */
.flip{animation:numFlip .3s ease-out}
@keyframes numFlip{from{transform:scale(1.2);opacity:0.5}to{transform:scale(1);opacity:1}}

</style>
</head>
<body>

<!-- 视频背景 -->
<video class="bg" autoplay muted loop playsinline poster="https://raw.githubusercontent.com/QingMing-game/ST0.1/main/BKG.gif">
  <source src="https://raw.githubusercontent.com/QingMing-game/ST0.1/main/VD1.mp4" type="video/mp4">
</video>

<div class="top">
  <div class="top-title">情谊率土 · 热血福利服</div>
  <div class="top-sub">High Welfare · Special Server</div>
</div>

<div class="enter-btn" id="enterBtn" onclick="togglePanel()">
  <span class="ec">进入</span>
  <span class="es">ENTER</span>
</div>

<!-- 底部面板 -->
<div class="panel" id="panel">
  <div class="p-handle" onclick="togglePanel()"></div>
  <div class="p-head">
    <div class="p-title">全服公测倒计时</div>
  </div>
  
  <div class="p-btns">
    <!-- 倒计时展示区 -->
    <div class="cd-row">
      <div class="cd-unit"><div class="cd-box"><span class="cd-n" id="p-d">--</span></div><span class="cd-lbl">天</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><div class="cd-box"><span class="cd-n" id="p-h">--</span></div><span class="cd-lbl">时</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><div class="cd-box"><span class="cd-n" id="p-m">--</span></div><span class="cd-lbl">分</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><div class="cd-box"><span class="cd-n" id="p-s">--</span></div><span class="cd-lbl">秒</span></div>
    </div>

    <a class="btn btn-red" href="你的下载链接">
      <span>立即预约下载</span>
    </a>
    <!-- 增加一键复制功能的群按钮 -->
    <button class="btn btn-blue" onclick="handleJoinGroup('1015267886')">
      <span>加入玩家交流群 (1015267886)</span>
    </button>
    <button class="btn" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5)" onclick="openModal()">
      <span>查看详细版本设定</span>
    </button>
  </div>
</div>

<!-- 弹窗公告 -->
<div id="modal">
  <div class="m-bg" onclick="closeModal()"></div>
  <div class="m-wrap">
    <div class="m-card">
      <div class="m-body">
        <div class="sec">
          <div class="sec-hd"><span class="sec-name">💎 上线豪礼</span></div>
          <div class="stat-grid">
            <div class="stat-cell"><div class="stat-v">88,888</div><div class="stat-k">初始虎符</div></div>
            <div class="stat-cell"><div class="stat-v">×3</div><div class="stat-k">五星自选卡包</div></div>
            <div class="stat-cell"><div class="stat-v">999万</div><div class="stat-k">战法经验</div></div>
          </div>
        </div>

        <div class="sec">
          <div class="sec-hd"><span class="sec-name">🔥 核心倍率</span></div>
          <div class="stat-grid">
            <div class="stat-cell"><div class="stat-v">25%</div><div class="stat-k">五星概率</div></div>
            <div class="stat-cell"><div class="stat-v">3倍</div><div class="stat-k">资源/建造速度</div></div>
            <div class="stat-cell"><div class="stat-v">21天</div><div class="stat-k">赛季周期</div></div>
          </div>
          <div class="note">全武将无屏蔽抽卡，曹操、张机、刘备等核心武将爆率全面提升，拒绝暗箱。</div>
        </div>

        <div class="sec">
          <div class="sec-hd"><span class="sec-name">⚔️ 赛季节奏</span></div>
          <div style="color:rgba(255,248,232,0.7); font-size:13px; line-height:2">
            • 第1-3天：开荒保护，资源翻倍，极速成型<br>
            • 第4-7天：关卡开放，州战一触即发<br>
            • 第15天：洛阳争夺战，决出最终征服盟
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 悬浮关闭按钮 -->
<div class="m-close-bar" id="closeBar">
  <button class="close-btn-main" onclick="closeModal()">我知道了，进入网页</button>
</div>

<script>
/* ── 核心逻辑 ── */
const TARGET_DATE = new Date('2026-03-31T16:00:00+08:00').getTime();
const state = { d: '00', h: '00', m: '00', s: '00' };
const pEls = {
  d: document.getElementById('p-d'), h: document.getElementById('p-h'),
  m: document.getElementById('p-m'), s: document.getElementById('p-s')
};

// 使用 RequestAnimationFrame 提升性能，减少电池消耗
function updateTimer() {
  const now = Date.now();
  const diff = TARGET_DATE - now;

  if (diff > 0) {
    const d = String(Math.floor(diff / 86400000)).padStart(2, '0');
    const h = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0');
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');

    updateIfChanged('d', d);
    updateIfChanged('h', h);
    updateIfChanged('m', m);
    updateIfChanged('s', s);
  }
  requestAnimationFrame(updateTimer);
}

function updateIfChanged(key, val) {
  if (state[key] !== val) {
    state[key] = val;
    const el = pEls[key];
    el.textContent = val;
    el.classList.remove('flip');
    void el.offsetWidth; // 触发重绘
    el.classList.add('flip');
  }
}

/* ── 交互控制 ── */
function togglePanel() {
  const panel = document.getElementById('panel');
  const btn = document.getElementById('enterBtn');
  panel.classList.toggle('show');
  btn.classList.toggle('hide');
}

function openModal() {
  document.getElementById('modal').style.display = 'block';
  document.getElementById('closeBar').classList.add('visible');
  document.body.style.overflow = 'hidden'; // 禁止滚动
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('closeBar').classList.remove('visible');
  document.body.style.overflow = ''; 
}

/* ── 复制功能 ── */
function handleJoinGroup(groupId) {
  const url = "https://qun.qq.com/universal-share/share?ac=1&authKey=JAAxXnQOTjw8AmPoY4T85ARdL8%2FRt0%2BI34O81lIucehnKbymJoSHKeukATkqfa2U";
  
  // 尝试复制
  const tempInput = document.createElement("input");
  tempInput.value = groupId;
  document.body.appendChild(tempInput);
  tempInput.select();
  try {
    document.execCommand("copy");
    alert("群号 " + groupId + " 已复制，正在跳转QQ...");
  } catch (e) {}
  document.body.removeChild(tempInput);
  
  // 跳转
  setTimeout(() => {
    window.open(url, '_blank');
  }, 500);
}

/* ── 初始化 ── */
window.onload = () => {
  updateTimer();
  // 智能延迟弹窗：2秒后如果没点击进入，则自动弹窗
  setTimeout(() => {
    if(!document.getElementById('panel').classList.contains('show')) {
      openModal();
    }
  }, 2000);
};
</script>

</body>
</html>
